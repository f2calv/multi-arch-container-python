[project]
name = "multi-arch-container-python"
version = "0.1.0"
description = "Multi-architecture container build for a Python worker application"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "f2calv" },
]
dependencies = []

[project.scripts]
multi-arch-container-python = "multi_arch_container_python.__main__:main"

[dependency-groups]
dev = [
  "ipykernel",
  "ipywidgets",
  "mypy",
  "pytest",
  "ruff",
  "tqdm",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "multi_arch_container_python"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "EXE002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
